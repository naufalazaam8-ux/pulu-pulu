<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotic Calculator</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  touch-action:manipulation;
}

body{
  width:100%;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(circle at top,#00ffff22,transparent 40%),
    linear-gradient(135deg,#020617,#0a1025,#000);
}

/* Setengah layar */
.calculator{
  width:360px;
  height:700px;

  padding:10px;

  border-radius:25px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  background:rgba(5,10,25,0.96);

  border:2px solid #00ffff33;

  box-shadow:
    0 0 20px #00ffff22,
    inset 0 0 15px #00ffff11;
}

.title{
  text-align:center;
  color:cyan;
  font-size:15px;
  letter-spacing:2px;
  margin-top:5px;

  text-shadow:0 0 10px cyan;
}

.display{
  flex:1;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  padding:10px;
}

/* Soal besar */
#question{
  color:white;

  font-size:40px;
  font-weight:bold;

  text-align:right;

  min-height:55px;

  margin-bottom:5px;

  overflow-x:auto;

  text-shadow:0 0 10px #00ffff88;
}

/* Hasil kecil */
#result{
  color:#8fa3b8;

  font-size:18px;

  text-align:right;

  min-height:25px;

  overflow-x:auto;
}

.buttons{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:8px;
}

button{
  height:55px;

  border:none;
  border-radius:16px;

  background:#10192f;

  color:white;

  font-size:20px;

  cursor:pointer;

  transition:0s;

  box-shadow:
    inset 0 0 8px #00ffff11,
    0 0 5px #00ffff22;

  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(0.94);
}

.operator{
  background:#ff008c;
}

.equal{
  background:#00ffae;
  color:black;
}

.top{
  background:#3f3f3f;
}

.science{
  background:#002244;
  color:cyan;
}

.zero{
  grid-column:span 2;
}

</style>
</head>

<body>

<div class="calculator">

  <div class="title">ROBOTIC CALCULATOR</div>

  <div class="display">
    <div id="question">0</div>
    <div id="result">0</div>
  </div>

  <div class="buttons">

    <button class="top" onclick="clearDisplay()">AC</button>
    <button class="top" onclick="deleteLast()">⌫</button>
    <button class="top" onclick="appendValue('%')">%</button>
    <button class="operator" onclick="appendValue('/')">÷</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('*')">×</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">−</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button class="zero" onclick="appendValue('0')">0</button>
    <button onclick="appendValue(',')">,</button>
    <button class="equal" onclick="calculate()">=</button>

    <button class="science" onclick="squareRoot()">√</button>
    <button class="science" onclick="square()">x²</button>
    <button class="science" onclick="power()">xʸ</button>
    <button class="science" onclick="appendValue('(')">(</button>

    <button class="science" onclick="appendValue(')')">)</button>
    <button class="science" onclick="sin()">sin</button>
    <button class="science" onclick="cos()">cos</button>
    <button class="science" onclick="tan()">tan</button>

  </div>

</div>

<script>

const question=document.getElementById("question");
const result=document.getElementById("result");

let expression="";

function formatNumber(num){

  if(num==="Error") return num;

  let parts=num.toString().split(".");

  parts[0]=Number(parts[0]).toLocaleString("id-ID");

  return parts.join(",");
}

function cleanExpression(exp){

  return exp
    .replace(/\./g,"")
    .replace(/,/g,".")
    .replace(/÷/g,"/")
    .replace(/×/g,"*")
    .replace(/%/g,"/100");
}

function appendValue(value){

  if(expression==="0"){
    expression=value;
  }else{
    expression+=value;
  }

  question.innerText=expression;
}

function calculate(){

  try{

    let calc=cleanExpression(expression);

    let answer=eval(calc);

    result.innerText="= "+formatNumber(answer);

    expression=answer.toString();

  }catch{

    result.innerText="Error";

  }
}

function clearDisplay(){

  expression="";

  question.innerText="0";
  result.innerText="0";
}

function deleteLast(){

  expression=expression.slice(0,-1);

  if(expression===""){
    question.innerText="0";
  }else{
    question.innerText=expression;
  }
}

function squareRoot(){

  try{

    let answer=Math.sqrt(eval(cleanExpression(expression)));

    result.innerText="= "+formatNumber(answer);

    expression=answer.toString();

  }catch{

    result.innerText="Error";

  }
}

function square(){

  try{

    let answer=Math.pow(eval(cleanExpression(expression)),2);

    result.innerText="= "+formatNumber(answer);

    expression=answer.toString();

  }catch{

    result.innerText="Error";

  }
}

function power(){

  appendValue("**");
}

function sin(){

  try{

    let answer=Math.sin(eval(cleanExpression(expression))*Math.PI/180);

    result.innerText="= "+formatNumber(answer.toFixed(6));

    expression=answer.toString();

  }catch{

    result.innerText="Error";

  }
}

function cos(){

  try{

    let answer=Math.cos(eval(cleanExpression(expression))*Math.PI/180);

    result.innerText="= "+formatNumber(answer.toFixed(6));

    expression=answer.toString();

  }catch{

    result.innerText="Error";

  }
}

function tan(){

  try{

    let answer=Math.tan(eval(cleanExpression(expression))*Math.PI/180);

    result.innerText="= "+formatNumber(answer.toFixed(6));

    expression=answer.toString();

  }catch{

    result.innerText="Error";

  }
}

</script>

</body>
</html>
